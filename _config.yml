title: Angli Liu
description: PhD student @ UW Allen School of Computer Science
baseurl: "" # leave empty for root domain
url: "https://anglil.github.io"

# Enable MathJax globally
mathjax: true

# Optional: add your photo (upload to /images/photo.jpg)
# avatar: "/images/your_photo.jpg"

# Force rebuild trigger + safety
future: true

# Exclude development and temp folders to keep the build under the 1GB Pages limit
exclude:
  - venv
  - diagram_crops
  - diagram_crops_ce
  - diagram_crops_ce2
  - filtered_diagrams
  - extracted_diagrams
  - "*.py"
  - "*.log"
  - "*.sh"
  - "*.swift"
  - "temp_*.png"
  - "temp_*.jpg"
  - "test_*.png"
  - "preview_page.png"
  - "*.docx"
  - "*.epub"
  - mac_ocr
  - fg791pip.txt
  - fg791pxe.txt
include:
  - album/photos